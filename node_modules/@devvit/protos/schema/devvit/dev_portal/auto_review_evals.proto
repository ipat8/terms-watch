syntax = "proto3";

package devvit.dev_portal;

import "google/protobuf/struct.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal";

// Candidate instructions and settings for one employee-only prompt evaluation.
message RunAutoReviewEvalRequest {
  // Published app slug. Eg, `pixelary-game`.
  string app_slug = 1;
  // Published app version. Eg, `1.2.3`.
  string app_version = 2;
  // Generated prompt to execute. Eg, `prompts/start/prompt.md`.
  string prompt = 3;
  // Generated prompt Markdown files.
  repeated AutoReviewEvalFile files = 4;
  // Generated candidate JSON Schema. Output must use schemaVersion 0.
  string output_schema = 5;
  // Harness model ID, or server default if empty. Eg, `openai/gpt-6.1-sol`.
  string model_id = 6;
  // Model reasoning effort, or server default if empty. Eg, `max`.
  string reasoning_effort = 7;
}

// A started prompt evaluation.
message RunAutoReviewEvalResponse {
  // Review ID. Eg, `4b1f457a-7b5b-49d4-8104-2c7b359f3128`.
  string id = 1;
}

// One generated prompt file.
message AutoReviewEvalFile {
  // Workspace-relative Markdown path. Eg, `prompts/blocks/prompt.md`.
  string path = 1;
  // Generated Markdown. Eg, `1. Pass if no custom post is registered.`.
  string content = 2;
}

// A prompt evaluation to inspect.
message GetAutoReviewEvalRequest {
  // Review ID. Eg, `4b1f457a-7b5b-49d4-8104-2c7b359f3128`.
  string id = 1;
}

// Progress and output for one prompt evaluation.
message GetAutoReviewEvalResponse {
  // Version-0 output validated against the supplied schema, if complete.
  google.protobuf.Struct output = 1;
  AutoReviewEvalStatus status = 2;
  // Failure message, if any.
  string error = 3;
}

// Execution state, independent of the prompt's pass/fail result.
enum AutoReviewEvalStatus {
  UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETED = 3;
  ERROR = 4;
  CANCELED = 5;
}
